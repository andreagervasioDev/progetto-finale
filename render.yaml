# Blueprint Render: tutta la piattaforma (ChromaDB + data agent + backend + frontend) in un solo servizio.
# Render → New → Blueprint → scegli questo repository. Al primo avvio chiede i valori con "sync: false".
services:
  - type: web
    name: progetto-management-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # piano gratuito: niente disco permanente, quindi utenti, conversazioni e documenti caricati
    # si azzerano a ogni riavvio o deploy; documenti ufficiali e dataset partite si ricaricano dal repository.
    # Dopo 15 minuti senza visite il servizio si spegne (un ping esterno, es. UptimeRobot, lo tiene sveglio).
    plan: free
    region: frankfurt
    # controllo leggero, senza ChromaDB e data agent: all'avvio sono occupati a indicizzare i documenti e
    # /api/health potrebbe superare i 5 secondi concessi da Render (deploy annullato dopo 15 minuti)
    healthCheckPath: /api/health/live
    # deploy solo se i controlli di GitHub Actions (.github/workflows/ci.yml) sono tutti verdi:
    # un commit che rompe i test o introduce una vulnerabilità nota non viene pubblicato
    autoDeployTrigger: checksPass
    envVars:
      # --- segreti: Render li chiede alla creazione del Blueprint ---
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_TEST_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # --- tetto di spesa OpenAI stimata al giorno (dollari): il sito è pubblico ---
      - key: DAILY_BUDGET_USD
        value: "1"
      # --- modelli ---
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      # --- online: porta di Render, HTTPS, frontend servito dal backend ---
      - key: PORT
        value: "10000"
      - key: BACKEND_PORT
        value: "10000"
      - key: SERVE_FRONTEND
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      # --- cartella dei dati nel container (temporanea sul piano free) ---
      - key: DATA_DIR
        value: /data
      - key: STORAGE_DIR
        value: /data/storage
      - key: DATASETS_DIR
        value: /data/datasets
      - key: ANALYZE_CACHE_DIR
        value: /data/cache
      # --- cache delle analisi su Redis (Key Value qui sotto); senza, il data agent usa il file JSON ---
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: progetto-management-ai-cache
          property: connectionString

  # Redis gestito da Render (Key Value) per la cache delle analisi. Piano gratuito: 25 MB e nessuna
  # persistenza, che per una cache va bene (al riavvio le analisi si rifanno). Con allkeys-lru, se la
  # memoria finisce Redis elimina le voci usate meno di recente invece di rifiutare le scritture.
  - type: keyvalue
    name: progetto-management-ai-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    # nessun accesso da internet: solo dai servizi Render della stessa regione, sulla rete privata
    ipAllowList: []
